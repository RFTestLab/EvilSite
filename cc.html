<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evil CC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Evil CC form</h5>
            <form id="ccForm" autocomplete="on">
              <div class="mb-3">
                <label for="evil-cc-number" class="form-label">Card number</label>
                <input id="evil-cc-number" autocomplete="cc-number" name="cc-number" type="text" class="form-control" placeholder="4111 1111 1111 1111" inputmode="numeric">
              </div>
              <div class="mb-3">
                <label for="evil-cc-exp" class="form-label">Expiry</label>
                <input id="evil-cc-exp" autocomplete="cc-exp" name="cc-exp" type="text" class="form-control" placeholder="MM/YY">
              </div>
              <div class="mb-3">
                <label for="evil-cc-csc" class="form-label">CVV/CVC</label>
                <input id="evil-cc-csc" autocomplete="cc-csc" name="cvv" type="text" class="form-control" placeholder="###" inputmode="numeric">
              </div>
              <button type="submit" class="btn btn-evil">Submit</button>
            </form>
            <div class="mt-3 small text-muted">This page simulates attacker-run credit card fields.</div>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-body">
            <h6 class="card-title">Local instrumentation log</h6>
            <div id="localLog" class="local-log"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/evil.js"></script>
  <script>
    EvilSite.init();
  </script>
</body>
</html>
