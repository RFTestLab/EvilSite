<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evil Dynamic Autofill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="container py-4">
    <div class="row g-3">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Evil Dynamic Autofill</h5>
            <p class="muted-small mb-0">
              DOM timing and mutation tests for mobile password managers inside an attacker-controlled frame.
            </p>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h6 class="card-title">Delayed credential form injection</h6>
            <div class="d-flex gap-2 flex-wrap mb-3">
              <button class="btn btn-sm btn-evil" data-delay="0" type="button">Inject now</button>
              <button class="btn btn-sm btn-outline-success" data-delay="500" type="button">Inject after 500ms</button>
              <button class="btn btn-sm btn-outline-success" data-delay="2000" type="button">Inject after 2s</button>
              <button id="clearDynamicBtn" class="btn btn-sm btn-outline-secondary" type="button">Clear</button>
            </div>
            <div id="dynamicZone" class="test-zone">
              <span class="muted-small">No injected form yet.</span>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h6 class="card-title">Focus replacement race</h6>
            <label for="replaceDelay" class="form-label">Replacement delay</label>
            <select id="replaceDelay" class="form-select mb-3">
              <option value="0">Immediate</option>
              <option value="250">250ms</option>
              <option value="1000">1s</option>
            </select>
            <form id="replacementForm" autocomplete="on">
              <div class="mb-2">
                <label for="race-email" class="form-label">Email</label>
                <input id="race-email" name="email" autocomplete="username" class="form-control" placeholder="race@example.com">
              </div>
              <div class="mb-2">
                <label for="race-password" class="form-label">Password</label>
                <input id="race-password" name="password" type="password" autocomplete="current-password" class="form-control" placeholder="Race password">
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <h6 class="card-title">Autocomplete mutation</h6>
            <div class="d-flex gap-2 flex-wrap mb-3">
              <button id="mutateBtn" type="button" class="btn btn-sm btn-evil">Mutate to credential fields</button>
              <button id="resetMutationBtn" type="button" class="btn btn-sm btn-outline-secondary">Reset mutation</button>
            </div>
            <form id="mutationForm" autocomplete="on">
              <div class="mb-2">
                <label for="mut-a" class="form-label">Search</label>
                <input id="mut-a" name="search" autocomplete="off" class="form-control" placeholder="Search query">
              </div>
              <div class="mb-2">
                <label for="mut-b" class="form-label">Note</label>
                <input id="mut-b" name="note" autocomplete="off" class="form-control" placeholder="Private note">
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <h6 class="card-title">Local instrumentation log</h6>
            <div id="localLog" class="local-log"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/evil.js"></script>
  <script>
    (function () {
      function injectDynamic(delay) {
        EvilSite.localLog("Dynamic injection requested: " + delay + "ms", "DYNAMIC");
        setTimeout(() => {
          document.getElementById("dynamicZone").innerHTML = `
            <form id="dynamicForm" autocomplete="on">
              <div class="mb-2">
                <label for="dyn-email" class="form-label">Injected email</label>
                <input id="dyn-email" name="email" autocomplete="username" class="form-control" placeholder="dynamic@example.com">
              </div>
              <div class="mb-2">
                <label for="dyn-password" class="form-label">Injected password</label>
                <input id="dyn-password" name="password" type="password" autocomplete="current-password" class="form-control" placeholder="Dynamic password">
              </div>
            </form>
          `;
          EvilSite.wireAllFields();
          EvilSite.snapshotAndReport("dynamic-form-injected");
        }, delay);
      }

      function replaceInput(input) {
        const clone = input.cloneNode(true);
        clone.value = "";
        clone.id = input.id + "-replaced";
        clone.name = input.name + "-replaced";
        clone.dataset.replaced = "true";
        input.replaceWith(clone);
        EvilSite.wireAllFields();
        EvilSite.localLog("Input replaced: " + input.id + " -> " + clone.id, "RACE");
        EvilSite.snapshotAndReport("input-replaced");
      }

      function resetMutation() {
        const a = document.getElementById("mut-a");
        const b = document.getElementById("mut-b");
        a.type = "text";
        a.name = "search";
        a.autocomplete = "off";
        a.placeholder = "Search query";
        b.type = "text";
        b.name = "note";
        b.autocomplete = "off";
        b.placeholder = "Private note";
        EvilSite.localLog("Mutation reset", "MUTATION");
        EvilSite.snapshotAndReport("mutation-reset");
      }

      EvilSite.init();

      document.querySelectorAll("[data-delay]").forEach((button) => {
        button.addEventListener("click", () => injectDynamic(Number(button.dataset.delay)));
      });
      document.getElementById("clearDynamicBtn").addEventListener("click", () => {
        document.getElementById("dynamicZone").innerHTML = '<span class="muted-small">No injected form yet.</span>';
        EvilSite.localLog("Dynamic zone cleared", "DYNAMIC");
        EvilSite.snapshotAndReport("dynamic-zone-cleared");
      });

      ["race-email", "race-password"].forEach((id) => {
        document.getElementById(id).addEventListener("focus", (event) => {
          if (event.target.dataset.replaced) return;
          const delay = Number(document.getElementById("replaceDelay").value);
          EvilSite.localLog("Replacement scheduled for " + id + ": " + delay + "ms", "RACE");
          setTimeout(() => replaceInput(event.target), delay);
        });
      });

      document.getElementById("mutateBtn").addEventListener("click", () => {
        const a = document.getElementById("mut-a");
        const b = document.getElementById("mut-b");
        a.name = "email";
        a.autocomplete = "username";
        a.placeholder = "mutated@example.com";
        b.type = "password";
        b.name = "password";
        b.autocomplete = "current-password";
        b.placeholder = "Mutated password";
        EvilSite.localLog("Fields mutated to credential semantics", "MUTATION");
        EvilSite.snapshotAndReport("autocomplete-mutated");
      });
      document.getElementById("resetMutationBtn").addEventListener("click", resetMutation);
    })();
  </script>
</body>
</html>
