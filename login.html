<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evil Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Evil page form</h5>
            <form id="evilForm" autocomplete="on">
              <div class="mb-3">
                <label for="evil-email" class="form-label">Email</label>
                <input id="evil-email" autocomplete="username" name="email" type="email" class="form-control" placeholder="evil_user@example.com">
              </div>
              <div class="mb-3">
                <label for="evil-password" class="form-label">Password</label>
                <input id="evil-password" autocomplete="current-password" name="password" type="password" class="form-control" placeholder="Evil_Password">
              </div>
              <div class="mb-3">
                <label class="form-label">Hidden field (prefill target)</label>
                <input id="evil-secret" type="text" name="secret" autocomplete="username" class="form-control" style="display:none;" />
              </div>
              <button type="submit" class="btn btn-evil">Sign In</button>
            </form>
            <div class="mt-3 small text-muted">This page simulates the attacker-controlled iframe.</div>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-body">
            <h6 class="card-title">Local instrumentation log</h6>
            <div id="localLog" class="local-log"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/evil.js"></script>
  <script>
    EvilSite.init();
  </script>
</body>
</html>
